name: validade pull request

on:
  pull_request:
    branches:
      - 'develop'
      - 'main'
    tags-ignore:
      - '*.*'

concurrency:
  group: pr-to-source-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  checks: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      # https://github.com/pnpm/action-setup
      - uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@24
          install: false

      - name: Install dependencies
        run: pnpm install

      - name: Run the PR check
        run: pnpm pullrequest
        env:
          CI: true
